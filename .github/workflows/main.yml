name: Cloudflared-RDP-Fixed

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Configure Windows RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        $Password = ConvertTo-SecureString "P@ssw0rd123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        
    - name: Download Cloudflared
      run: |
        Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"

    - name: Run Cloudflare Tunnel
      shell: pwsh
      env:
        CF_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      run: |
        if (-not $env:CF_TOKEN) {
          Write-Error "ERROR: CLOUDFLARE_TUNNEL_TOKEN is empty! Please check your GitHub Secrets."
          exit 1
        }
        # We use --no-autoupdate to prevent the runner from hanging on updates
        .\cloudflared.exe tunnel --no-autoupdate run --token "$env:TUNNEL_TOKEN"
